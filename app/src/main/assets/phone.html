<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مترجم الألعاب">
<meta name="theme-color" content="#101418">
<title>مترجم الألعاب</title>
<style>
:root{--bg:#101418;--card:#1a2027;--ink:#f2f4f7;--muted:#9aa4b2;--accent:#ffb020;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,"SF Arabic","Geeza Pro",system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 24px)}
h1{font-size:28px;margin:0 0 2px}
#conn{margin:0 0 18px;color:var(--muted);font-size:15px}
#conn.bad{color:var(--bad)}
.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:96px;border-radius:20px;background:var(--accent);
  color:#1b1300;font-size:22px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.big:active{transform:scale(.98)}
.big svg{width:30px;height:30px}
.small{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:10px;border-radius:14px;
  border:1px solid #2f3843;color:var(--ink);font-size:16px;cursor:pointer}
.opts{margin-top:16px;background:var(--card);border-radius:16px;padding:6px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.row+.row{border-top:1px solid #262e37}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
.seg{display:flex;gap:6px}
.seg button{min-width:48px;min-height:40px;border-radius:10px;border:1px solid #2f3843;background:transparent;color:var(--ink);font-size:15px}
.seg button.on{background:var(--accent);color:#1b1300;border-color:var(--accent);font-weight:700}
#out{margin-top:18px;background:var(--card);border-radius:16px;padding:16px}
#msg{color:var(--muted);font-size:15px}
#msg.bad{color:var(--bad)}
#ar{font-size:21px;line-height:1.7;white-space:pre-wrap;margin-top:6px}
details{margin-top:12px;color:var(--muted)}
summary{cursor:pointer;min-height:36px}
#en{white-space:pre-wrap;font-size:15px;text-align:left}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions button{flex:1;min-height:46px;border-radius:12px;border:1px solid #2f3843;background:transparent;color:var(--ink);font-size:15px}
#hist h2{font-size:16px;color:var(--muted);margin:26px 0 8px}
.h{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;white-space:pre-wrap;font-size:16px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;
  animation:r .8s linear infinite;vertical-align:-3px;margin-left:6px}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<h1>مترجم الألعاب</h1>
<p id="conn">يتصل بالتلفزيون…</p>

<label class="big" for="cam">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
  صوّر شاشة اللعبة
</label>
<input class="file" id="cam" type="file" accept="image/*" capture="environment">
<label class="small" for="pick">أو اختر صورة من الألبوم</label>
<input class="file" id="pick" type="file" accept="image/*">

<div class="opts">
  <label class="row" for="tv"><span>اعرض الترجمة على التلفزيون</span><input type="checkbox" id="tv" checked></label>
  <div class="row"><span>حجم خط التلفزيون</span>
    <div class="seg" id="seg"><button data-s="20">صغير</button><button data-s="26">وسط</button><button data-s="34">كبير</button></div>
  </div>
</div>

<section id="out" hidden>
  <div id="msg"></div>
  <div id="ar"></div>
  <details id="det" hidden><summary>النص الأصلي</summary><div id="en" dir="ltr"></div></details>
  <div class="actions" id="acts" hidden>
    <button id="again">اعرضها مرة ثانية على التلفزيون</button>
    <button id="hide">إخفاء من التلفزيون</button>
  </div>
</section>

<section id="hist"></section>

<script>
{
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let size = store.get('size', '26');
  let last = null;
  let overlayOk = true;
  const history = [];

  $('tv').checked = store.get('tv', '1') === '1';
  $('tv').addEventListener('change', () => store.set('tv', $('tv').checked ? '1' : '0'));

  function paintSeg() {
    for (const b of $('seg').querySelectorAll('button')) b.classList.toggle('on', b.dataset.s === size);
  }
  $('seg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    size = b.dataset.s; store.set('size', size); paintSeg();
  });
  paintSeg();

  function setMsg(text, bad, busy) {
    $('out').hidden = false;
    $('msg').className = bad ? 'bad' : '';
    $('msg').textContent = text;
    if (busy) { const s = document.createElement('span'); s.className = 'spin'; $('msg').prepend(s); }
  }

  async function checkConn() {
    try {
      const r = await fetch('/status', { cache: 'no-store' });
      const j = await r.json();
      overlayOk = !!j.overlay;
      $('conn').className = '';
      $('conn').textContent = overlayOk ? 'متصل بالتلفزيون' : 'متصل بالتلفزيون، بس التلفزيون ما عنده إذن الظهور فوق الشاشة. الترجمة بتطلع هنا.';
    } catch (e) {
      $('conn').className = 'bad';
      $('conn').textContent = 'انقطع الاتصال بالتلفزيون. تأكد إن تطبيق المترجم شغّال وإنكم على نفس الواي فاي.';
    }
  }
  checkConn();
  setInterval(checkConn, 15000);

  function toJpeg(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 2000;
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error('ما قدرت أجهّز الصورة')), 'image/jpeg', 0.9);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('ما قدرت أفتح الصورة')); };
      img.src = url;
    });
  }

  function showResult(j) {
    $('ar').textContent = j.translated;
    $('en').textContent = j.original;
    $('det').hidden = !j.original;
    $('acts').hidden = !j.translated || !overlayOk;
  }

  function renderHistory() {
    const box = $('hist');
    box.textContent = '';
    if (history.length < 2) return;
    const h = document.createElement('h2');
    h.textContent = 'الترجمات السابقة';
    box.appendChild(h);
    for (const item of history.slice(1)) {
      const d = document.createElement('div');
      d.className = 'h';
      d.textContent = item.translated;
      box.appendChild(d);
    }
  }

  async function handle(input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    $('ar').textContent = ''; $('det').hidden = true; $('acts').hidden = true;
    setMsg('أجهّز الصورة…', false, true);
    try {
      const blob = await toJpeg(file);
      setMsg('أقرا النص وأترجمه…', false, true);
      const tv = $('tv').checked ? 1 : 0;
      const r = await fetch('/translate?tv=' + tv + '&size=' + size, {
        method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob
      });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'صار خطأ');
      overlayOk = !!j.overlay;
      if (!j.original) { setMsg('ما لقيت نص في الصورة. قرّب الكاميرا من الكلام وخلّها ثابتة.', true); return; }
      last = j;
      history.unshift(j);
      if (history.length > 11) history.pop();
      setMsg(tv && overlayOk ? 'الترجمة ظاهرة على التلفزيون' : 'الترجمة:', false);
      showResult(j);
      renderHistory();
    } catch (e) {
      setMsg((e && e.message) ? e.message : 'صار خطأ، جرّب مرة ثانية', true);
    }
  }

  $('cam').addEventListener('change', e => handle(e.target));
  $('pick').addEventListener('change', e => handle(e.target));

  $('hide').addEventListener('click', () => { fetch('/hide', { method: 'POST' }).catch(() => {}); });
  $('again').addEventListener('click', async () => {
    if (!last) return;
    // Re-send the text only: ask the TV to show the last translation again.
    try {
      await fetch('/show?size=' + size, { method: 'POST', headers: { 'Content-Type': 'text/plain; charset=utf-8' }, body: last.translated });
    } catch (e) {}
  });
}
</script>
</body>
</html>
